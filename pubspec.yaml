name: nuropulse
description: "A Parkinson’s companion app that screens for hand tremor in under half a minute using just your phone’s sensors, then connects you and your neurologist with your medication and tremor history."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.3.0
  fftea: ^1.5.0+1
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  json_annotation: ^4.12.0
  logger: ^2.8.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  uuid: ^4.6.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: 3.2.5
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
